name: Build AllDocs APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AllDocsApp
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Imposta JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Imposta Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Accetta le licenze SDK
        run: yes | sdkmanager --licenses || true

      - name: Installa piattaforma e build-tools Android
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Imposta Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila l'APK (debug, installabile subito)
        run: gradle assembleDebug --no-daemon

      - name: Carica l'APK come file scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: AllDocs-apk
          path: AllDocsApp/app/build/outputs/apk/debug/app-debug.apk
